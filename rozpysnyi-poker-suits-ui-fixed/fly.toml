# Розписний покер — Fly.io
# Деплой:  fly launch   або   fly deploy
# Документація: https://fly.io/docs/

app = "rozpysnyi-poker"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DISABLE_LOCAL_HTTPS = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 = безкоштовніше (засинає без гравців); 1 = завжди «теплий» інстанс
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
