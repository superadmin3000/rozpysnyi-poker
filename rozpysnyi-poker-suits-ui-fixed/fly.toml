# Розписний покер — конфіг Fly.io
# Після `fly launch` можна підправити app-ім'я нижче.

app = "rozpysnyi-poker"
primary_region = "waw"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
