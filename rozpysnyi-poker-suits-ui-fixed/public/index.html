<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c4e31">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Розписний покер">
<meta name="description" content="Онлайн розписний покер на 4 гравці">
<title>Розписний покер — онлайн</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section id="lobby" class="lobby panel">
    <div class="brand"><span class="suit">♠</span><div><h1>Розписний покер</h1><p>Онлайн · 4 гравці</p></div></div>
    <input id="name" placeholder="Ваше ім'я" maxlength="20" autocomplete="off">
    <button id="create" class="primary">Створити кімнату</button>
    <div class="or"><span>або</span></div>
    <div class="join"><input id="code" placeholder="Код кімнати" maxlength="6" autocomplete="off"><button id="join">Приєднатися</button></div>
    <p id="err" class="error"></p>
    <button id="installBtn" class="secondary install-btn" type="button" hidden>📲 Встановити на телефон</button>
    <div class="rules-mini">37 карт · 4 гравці · 1–9 · Темна · Без козиря · Золота ×4 · Мізер</div>
    <p class="pwa-hint">На телефоні: у браузері «Додати на головний екран» — гра відкриється як додаток.</p>
  </section>

  <section id="game" hidden>
    <header class="topbar">
      <div class="brand small"><span class="suit">♠</span><div><h1>Розписний покер</h1><span id="room"></span></div></div>
      <div class="top-actions">
        <button id="sfxBtn" class="voice-btn sfx-btn" type="button" title="Вимкнути звук" onclick="toggleSfx()">🔊</button>
        <button id="reloadBtn" class="voice-btn sfx-btn" type="button" title="Оновити гру" onclick="reloadGame()">🔄</button>
        <button id="voiceBtn" class="voice-btn" type="button" title="Увімкнути мікрофон">🎤</button>
        <span id="voiceStatus" class="voice-status"></span>
        <div class="roundBadge"><span id="round"></span></div>
        <div id="hostMenuWrap" class="host-menu-wrap" hidden>
          <button type="button" id="hostMenuBtn" class="voice-btn host-menu-btn" title="Меню господаря">☰</button>
          <div id="hostMenu" class="host-menu" hidden>
            <button type="button" onclick="newGame();closeHostMenu()">Почати по новій</button>
            <button type="button" class="danger" onclick="endGame();closeHostMenu()">Завершити гру</button>
            <button type="button" onclick="reloadGame();closeHostMenu()">🔄 Оновити гру</button>
          </div>
        </div>
      </div>
    </header>

    <div class="game-layout">
      <div class="game-main">
        <main class="table-wrap">
          <div class="table">
            <div class="felt">
              <div class="table-ring"></div>
              <div class="seat seat-bottom" id="player1"></div>
              <div class="seat seat-left" id="player2"></div>
              <div class="seat seat-top" id="player3"></div>
              <div class="seat seat-right" id="player4"></div>

              <!-- Козир окремо в куті, щоб не плутали зі зроблітом -->
              <div class="trump-slot" id="trump"></div>

              <div class="center">
                <div class="trick" id="trick"></div>
                <div class="info" id="info"></div>
              </div>
              <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
            </div>
          </div>
        </main>

        <div class="actions-bar">
          <div class="actions" id="actions"></div>
        </div>

        <section class="bottom-panel">
          <div class="hand-title">Ваші карти <span id="handHint"></span></div>
          <div class="hand" id="hand"></div>
          <div class="below-grid">
            <div class="scoreboard"><h3>Рахунок</h3><div id="score"></div></div>
            <div class="log"><h3>Історія ходів</h3><div id="log"></div></div>
          </div>
        </section>
      </div>
    </div>
  </section>
</div>
<div id="remoteAudios" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  if(installBtn) installBtn.hidden=false;
});
if(installBtn){
  installBtn.addEventListener('click',async()=>{
    if(!deferredPrompt){
      alert('Щоб встановити:\nAndroid Chrome — меню ⋮ → «Додати на головний екран»\niPhone Safari — Поділитися → «На екран «Домів»»');
      return;
    }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    installBtn.hidden=true;
  });
}
</script>
</body>
</html>
