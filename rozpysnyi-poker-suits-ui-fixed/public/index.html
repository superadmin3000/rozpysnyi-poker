<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Розписний покер — онлайн</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section id="lobby" class="lobby panel">
    <div class="brand"><span class="suit">♠</span><div><h1>Розписний покер</h1><p>Онлайн · 4 гравці</p></div></div>
    <input id="name" placeholder="Ваше ім'я" maxlength="20" autocomplete="off">
    <button id="create" class="primary">Створити кімнату</button>
    <div class="or"><span>або</span></div>
    <div class="join"><input id="code" placeholder="Код кімнати" maxlength="6" autocomplete="off"><button id="join">Приєднатися</button></div>
    <p id="err" class="error"></p>
    <div class="rules-mini">37 карт · 4 гравці · 1–9 · Темна · Без козиря · Золота ×4 · Мізер</div>
  </section>

  <section id="game" hidden>
    <header class="topbar">
      <div class="brand small"><span class="suit">♠</span><div><h1>Розписний покер</h1><span id="room"></span></div></div>
      <div class="top-actions">
        <button id="sfxBtn" class="voice-btn sfx-btn" type="button" title="Вимкнути звук" onclick="toggleSfx()">🔊</button>
        <button id="voiceBtn" class="voice-btn" type="button" title="Увімкнути мікрофон">🎤 Мікрофон</button>
        <span id="voiceStatus" class="voice-status"></span>
        <div class="roundBadge"><span id="round"></span><span id="phase"></span></div>
      </div>
    </header>

    <div class="game-layout">
      <div class="game-main">
        <main class="table-wrap">
          <div class="table">
            <div class="felt">
              <div class="table-ring"></div>
              <div class="seat seat-bottom" id="player1"></div>
              <div class="seat seat-left" id="player2"></div>
              <div class="seat seat-top" id="player3"></div>
              <div class="seat seat-right" id="player4"></div>

              <div class="center">
                <div class="trump" id="trump"></div>
                <div class="trick" id="trick"></div>
                <div class="info" id="info"></div>
                <div class="actions" id="actions"></div>
              </div>
              <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
            </div>
          </div>
        </main>

        <section class="bottom-panel">
          <div class="hand-title">Ваші карти <span id="handHint"></span></div>
          <div class="hand" id="hand"></div>
          <div class="below-grid">
            <div class="scoreboard"><h3>Рахунок</h3><div id="score"></div></div>
            <div class="log"><h3>Історія</h3><div id="log"></div></div>
          </div>
        </section>
      </div>

      <aside class="chat-panel">
        <div class="chat-header">
          <h3>Чат</h3>
          <span id="chatVoiceHint" class="chat-hint"></span>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" type="text" maxlength="200" placeholder="Повідомлення..." autocomplete="off">
          <button type="submit">➤</button>
        </form>
      </aside>
    </div>
  </section>
</div>
<div id="remoteAudios" hidden></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body>
</html>
